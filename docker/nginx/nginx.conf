# ==============================================================================
# docker/web/nginx.conf
#
# Document root matches the structure seen in your actual production
# logs: requests like /admin/enterprise/index.php resolve under
# /var/www/html/public. Adjust `root` below if that's not exactly right
# — it's inferred from the log paths, not confirmed against your real
# directory layout.
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;
    index index.php index.html index.htm;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    # Real request size limit for file-based imports (batch CSVs etc.) —
    # the dev server has no such limit at all, which is itself a problem
    # (unbounded uploads), but a real number needs to come from whatever
    # your largest expected import file actually is. 20M is a starting
    # point, not a confirmed value.
    client_max_body_size 20M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # Real timeouts — the dev server effectively has none, which is
        # exactly how a single slow request can quietly hang the entire
        # (single-threaded) process. 60s is a reasonable default for
        # normal page requests; it deliberately does NOT need to
        # accommodate whole-batch execution anymore, since that's now
        # queued and handled by worker.php instead of inline in an HTTP
        # request (see Track A).
        fastcgi_read_timeout 60s;
        fastcgi_send_timeout 60s;
    }

    # Never serve dotfiles (.env, .git, etc.)
    location ~ /\. {
        deny all;
    }

    # Deny access to sensitive files
    location ~* \.(env|log|sql)$ {
        deny all;
    }

    # Basic security headers — not a substitute for the real security
    # review Track E covers, but free to add and worth having from day one.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
