; ==============================================================================
; docker/web/www.conf
;
; Starting-point PHP-FPM pool tuning. These numbers are reasonable
; defaults for a small-to-medium instance, NOT numbers derived from
; load testing your actual traffic — that's explicitly still an open
; Track C item. Revisit after a real load test rather than trusting
; these as final.
; ==============================================================================

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

; Dynamic scales the number of PHP-FPM worker processes between
; min_spare_servers and max_spare_servers based on actual load, rather
; than a fixed count — fits a workload that's mostly idle punctuated by
; bursts (an Owner reviewing/enqueuing a batch), better than "static"
; would.
pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Real request timeout matching nginx's fastcgi_read_timeout above —
; keep these two in sync if either changes.
request_terminate_timeout = 60s

; Slow-request logging — anything taking over 5s gets logged with a
; full stack trace of where it's stuck. This is genuinely useful for
; catching a real production problem (a query that's gone slow, an
; external API call hanging) that would otherwise just look like
; generic latency.
slowlog = /var/log/php-fpm-slow.log
request_slowlog_timeout = 5s

php_admin_value[error_log] = /var/log/php-fpm-error.log
php_admin_flag[log_errors] = on
