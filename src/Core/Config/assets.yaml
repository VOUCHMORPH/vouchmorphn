version: "3.1.0"

# Shared asset type definitions (DRY - used by all participants)
ACCOUNT:
  category: BANK_ACCOUNT
  delivery: [deposit, cashout]
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit: false
  ui:
    icon: "🏦"
    category: banking
    color: "#4CAF50"
  fields:
    - name: account_number
      label: "Account Number"
      type: text
      required: true
      pattern: "^[0-9]{8,16}$"
      placeholder: "Enter account number"
      min_length: 8
      max_length: 16

ATM:
  category: ATM
  delivery: [cashout]
  hold_required: true
  hold_expiry_seconds: 300
  reversal_window_seconds: 1800
  partial_debit: false
  ui:
    icon: "🏧"
    category: atm
    color: "#2196F3"
  fields:
    - name: atm_code
      label: "ATM Code"
      type: text
      required: true
      pattern: "^[0-9]{6}$"
      placeholder: "6-digit ATM code"
    - name: atm_pin
      label: "ATM PIN"
      type: password
      required: true
      placeholder: "Enter ATM PIN"
      vault_field: pin

CASHOUT-VOUCHER:
  category: VOUCHER
  delivery: [cashout]
  hold_required: true
  hold_expiry_seconds: 600
  reversal_window_seconds: 3600
  partial_debit: false
  ui:
    icon: "🎫"
    category: voucher
    color: "#FF9800"
  fields:
    - name: voucher_number
      label: "Voucher Number"
      type: text
      required: true
      pattern: "^[A-Z0-9]{8,16}$"
      placeholder: "Enter voucher number"
    - name: voucher_pin
      label: "Voucher PIN"
      type: password
      required: true
      placeholder: "Enter voucher PIN"
      vault_field: pin

MNO-WALLET:
  category: MOBILE_MONEY
  delivery: [deposit, cashout]
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit: true
  ui:
    icon: "📱"
    category: mobile_money
    color: "#E91E63"
  fields:
    - name: phone_number
      label: "Phone Number"
      type: tel
      required: true
      pattern: "^\\+?267[0-9]{8}$"
      placeholder: "+26771XXXXXX"
      source:
        type: session
        field: phone
      readonly: true
    - name: wallet_pin
      label: "Wallet PIN"
      type: password
      required: true
      placeholder: "Enter mobile money PIN"
      vault_field: pin
      max_length: 6
      min_length: 4

BANK-WALLET:
  category: BANK_WALLET
  delivery: [deposit, cashout]
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit: true
  ui:
    icon: "👛"
    category: wallet
    color: "#9C27B0"
  fields:
    - name: wallet_pin
      label: "Wallet PIN"
      type: password
      required: true
      placeholder: "Enter wallet PIN"
      vault_field: pin

CARD:
  category: PAYMENT_CARD
  delivery: [deposit, cashout]
  hold_required: true
  hold_expiry_seconds: 1800
  reversal_window_seconds: 259200
  partial_debit: true
  ui:
    icon: "💳"
    category: card
    color: "#673AB7"
  fields:
    - name: card_number
      label: "Card Number"
      type: text
      required: true
      pattern: "^[0-9]{16}$"
      placeholder: "16-digit card number"
      vault_field: pan
    - name: card_pin
      label: "Card PIN"
      type: password
      required: true
      placeholder: "Enter card PIN"
      vault_field: pin
      max_length: 6
      min_length: 4
    - name: cvv
      label: "CVV"
      type: password
      required: true
      placeholder: "3-digit CVV"
      vault_field: cvv
      max_length: 4
      min_length: 3
    - name: expiry_month
      label: "Expiry Month"
      type: number
      required: true
      placeholder: "MM"
      min: 1
      max: 12
      vault_field: expiry_month
    - name: expiry_year
      label: "Expiry Year"
      type: number
      required: true
      placeholder: "YYYY"
      min: 2024
      max: 2034
      vault_field: expiry_year
