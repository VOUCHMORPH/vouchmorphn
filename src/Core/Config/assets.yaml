# ============================================
# ASSET TYPES
# ============================================
# This file defines every asset type in the system.
# One asset type can be used by multiple participants.
# ============================================

version: "3.1.0"

# ------------------------------------------------------------
# ACCOUNT - Standard bank account
# ------------------------------------------------------------
ACCOUNT:
  category: BANK_ACCOUNT
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit_allowed: false
  
  ui:
    icon: "🏦"
    display_name: "Bank Account"
    color: "#4CAF50"
  
  fields:
    - name: account_number
      label: "Account Number"
      type: text
      required: true
      pattern: "^[0-9]{8,16}$"
      min_length: 8
      max_length: 16

# ------------------------------------------------------------
# ATM - ATM cash withdrawal
# ------------------------------------------------------------
ATM:
  category: ATM
  delivery_modes:
    - cashout
  hold_required: true
  hold_expiry_seconds: 300
  reversal_window_seconds: 1800
  partial_debit_allowed: false
  
  ui:
    icon: "🏧"
    display_name: "ATM Cashout"
    color: "#2196F3"
  
  fields:
    - name: atm_code
      label: "ATM Code"
      type: text
      required: true
      pattern: "^[0-9]{6}$"
    
    - name: atm_pin
      label: "ATM PIN"
      type: password
      required: true
      vault_field: pin

# ------------------------------------------------------------
# CASHOUT-VOUCHER - Prepaid voucher
# ------------------------------------------------------------
CASHOUT-VOUCHER:
  category: VOUCHER
  delivery_modes:
    - cashout
  hold_required: true
  hold_expiry_seconds: 600
  reversal_window_seconds: 3600
  partial_debit_allowed: false
  
  ui:
    icon: "🎫"
    display_name: "Cashout Voucher"
    color: "#FF9800"
  
  fields:
    - name: voucher_number
      label: "Voucher Number"
      type: text
      required: true
      pattern: "^[A-Z0-9]{8,16}$"
    
    - name: voucher_pin
      label: "Voucher PIN"
      type: password
      required: true
      vault_field: pin

# ------------------------------------------------------------
# MNO-WALLET - Mobile money wallet
# ------------------------------------------------------------
MNO-WALLET:
  category: MOBILE_MONEY
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit_allowed: true
  
  ui:
    icon: "📱"
    display_name: "Mobile Wallet"
    color: "#E91E63"
  
  fields:
    - name: phone_number
      label: "Phone Number"
      type: tel
      required: true
      pattern: "^\\+?267[0-9]{8}$"
      readonly: true
      source: session.phone
    
    - name: wallet_pin
      label: "Wallet PIN"
      type: password
      required: true
      vault_field: pin
      min_length: 4
      max_length: 6

# ------------------------------------------------------------
# BANK-WALLET - Bank's digital wallet
# ------------------------------------------------------------
BANK-WALLET:
  category: BANK_WALLET
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit_allowed: true
  
  ui:
    icon: "👛"
    display_name: "Bank Wallet"
    color: "#9C27B0"
  
  fields:
    - name: wallet_pin
      label: "Wallet PIN"
      type: password
      required: true
      vault_field: pin

# ------------------------------------------------------------
# CARD - Payment card
# ------------------------------------------------------------
CARD:
  category: PAYMENT_CARD
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 1800
  reversal_window_seconds: 259200
  partial_debit_allowed: true
  
  ui:
    icon: "💳"
    display_name: "Payment Card"
    color: "#673AB7"
  
  fields:
    - name: card_number
      label: "Card Number"
      type: text
      required: true
      pattern: "^[0-9]{16}$"
      vault_field: pan
    
    - name: card_pin
      label: "Card PIN"
      type: password
      required: true
      vault_field: pin
      min_length: 4
      max_length: 6
    
    - name: cvv
      label: "CVV"
      type: password
      required: true
      vault_field: cvv
      min_length: 3
      max_length: 4
    
    - name: expiry_month
      label: "Expiry Month"
      type: number
      required: true
      min: 1
      max: 12
    
    - name: expiry_year
      label: "Expiry Year"
      type: number
      required: true
      min: 2024
      max: 2034
