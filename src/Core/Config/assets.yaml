# ============================================
# ASSET TYPES - GLOBAL CONFIGURATION
# ============================================
# This file defines every asset type in the system.
# Shared across ALL countries.
# ============================================

version: "3.1.0"

# ------------------------------------------------------------
# ACCOUNT - Standard bank account
# ------------------------------------------------------------
ACCOUNT:
  category: BANK_ACCOUNT
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit_allowed: false
  
  ui:
    icon: "🏦"
    display_name: "Bank Account"
    color: "#4CAF50"
    description: "Standard bank account with account number"
  
  fields:
    - name: account_number
      label: "Account Number"
      type: text
      required: true
      pattern: "^[A-Z0-9]{8,16}$"
      min_length: 8
      max_length: 16
      placeholder: "Enter account number"
      help_text: "8-16 digit account number"

# ------------------------------------------------------------
# ATM - ATM cash withdrawal
# ------------------------------------------------------------
ATM:
  category: ATM
  delivery_modes:
    - cashout
    - deposit
  hold_required: true
  hold_expiry_seconds: 300
  reversal_window_seconds: 1800
  partial_debit_allowed: false
  
  ui:
    icon: "🏧"
    display_name: "ATM Cashout"
    color: "#2196F3"
    description: "ATM withdrawal with code and PIN"
  
  fields:
    - name: atm_code
      label: "ATM Code"
      type: text
      required: true
      pattern: "^[0-9]{6}$"
      placeholder: "Enter ATM code"
      help_text: "6-digit ATM code"
    
    - name: atm_pin
      label: "ATM PIN"
      type: password
      required: true
      vault_field: pin
      min_length: 4
      max_length: 6
      placeholder: "Enter ATM PIN"
      help_text: "4-6 digit ATM PIN"

# ------------------------------------------------------------
# VOUCHER - Prepaid voucher
# ------------------------------------------------------------
VOUCHER:
  category: VOUCHER
  delivery_modes:
    - cashout
    - deposit
  hold_required: true
  hold_expiry_seconds: 600
  reversal_window_seconds: 3600
  partial_debit_allowed: false
  
  ui:
    icon: "🎫"
    display_name: "ATM Cashout Voucher"
    color: "#FF9800"
    description: "Prepaid voucher with number and PIN"
  
  fields:
    - name: voucher_number
      label: "Voucher Number"
      type: text
      required: true
      pattern: "^[A-Z0-9]{8,16}$"
      placeholder: "Enter voucher number"
      help_text: "8-16 character voucher number"
    
    - name: voucher_pin
      label: "Voucher PIN"
      type: password
      required: true
      vault_field: pin
      min_length: 4
      max_length: 6
      placeholder: "Enter voucher PIN"
      help_text: "4-6 digit voucher PIN"
    
    - name: amount
      label: "Voucher Amount"
      type: number
      required: true
      min: 1
      placeholder: "0.00"
      help_text: "Amount on the voucher"
    
    - name: phone
      label: "Phone Number"
      type: tel
      required: false
      pattern: "^\\+?[0-9]{10,15}$"
      placeholder: "+267XXXXXXXX"
      help_text: "Phone number associated with the voucher"

# ------------------------------------------------------------
# WALLET - Unified wallet (both mobile and bank wallets)
# ------------------------------------------------------------
WALLET:
  category: WALLET
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 900
  reversal_window_seconds: 86400
  partial_debit_allowed: true
  
  ui:
    icon: "👛"
    display_name: "Wallet"
    color: "#9C27B0"
    description: "Wallet (mobile or bank wallet)"
  
  fields:
    - name: phone
      label: "Phone Number"
      type: tel
      required: true
      pattern: "^\\+?[0-9]{10,15}$"
      placeholder: "+267XXXXXXXX"
      help_text: "Phone number (country code optional)"
    
    - name: wallet_pin
      label: "Wallet PIN"
      type: password
      required: false
      vault_field: pin
      min_length: 4
      max_length: 6
      placeholder: "Enter wallet PIN (optional)"
      help_text: "4-6 digit wallet PIN (optional)"

# ------------------------------------------------------------
# CARD - Payment card
# ------------------------------------------------------------
CARD:
  category: PAYMENT_CARD
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 1800
  reversal_window_seconds: 259200
  partial_debit_allowed: true
  
  ui:
    icon: "💳"
    display_name: "Payment Card"
    color: "#673AB7"
    description: "Payment card with CVV"
  
  fields:
    - name: card_number
      label: "Card Number"
      type: text
      required: true
      pattern: "^[0-9]{16}$"
      vault_field: pan
      placeholder: "1234-5678-9012-3456"
      help_text: "16-digit card number"
    
    - name: card_pin
      label: "Card PIN"
      type: password
      required: true
      vault_field: pin
      min_length: 4
      max_length: 6
      placeholder: "Enter card PIN"
      help_text: "4-6 digit card PIN"
    
    - name: cvv
      label: "CVV"
      type: password
      required: true
      vault_field: cvv
      min_length: 3
      max_length: 4
      placeholder: "123"
      help_text: "3-4 digit CVV"
    
    - name: expiry_month
      label: "Expiry Month"
      type: number
      required: true
      min: 1
      max: 12
      placeholder: "MM"
      help_text: "Expiry month (1-12)"
    
    - name: expiry_year
      label: "Expiry Year"
      type: number
      required: true
      min: 2024
      max: 2034
      placeholder: "YYYY"
      help_text: "Expiry year"

# ------------------------------------------------------------
# VISA_MASTERCARD_CARD - Visa/Mastercard card (card network source)
# ------------------------------------------------------------
VISA_MASTERCARD_CARD:
  category: CARD_NETWORK_SOURCE
  delivery_modes:
    - cashout
    - deposit
  hold_required: true
  hold_expiry_seconds: 604800
  reversal_window_seconds: 15552000
  partial_debit_allowed: true

  ui:
    icon: "💳"
    display_name: "Visa/Mastercard"
    color: "#1A1F71"
    description: "Visa or Mastercard card (any issuing bank) — distinct from VouchMorph's own vaulted CARD type"

  fields:
    - name: card_token
      label: "Card"
      type: text
      required: true
      vault_field: token
      help_text: "Produced by the acquirer's tokenization step — raw PAN never stored. This same field name (card_token) is what SwapService's extractDestinationIdentifier()/processDepositWithProof() patches now consistently populate for CARD sources AND destinations."

    - name: cvv
      label: "CVV"
      type: password
      required: true
      vault_field: cvv
      min_length: 3
      max_length: 4
      help_text: "Used ONCE at authorization time. Never stored — see CardAcquirerBankClient::stripCvvAfterUse()."

    - name: expiry_month
      label: "Expiry Month"
      type: number
      required: true
      min: 1
      max: 12

    - name: expiry_year
      label: "Expiry Year"
      type: number
      required: true
      min: 2024
      max: 2040

    - name: last4
      label: "Last 4 Digits"
      type: text
      required: false
      help_text: "Display only"

# ------------------------------------------------------------
# POSTAL-ORDER - Postal money order
# ------------------------------------------------------------
POSTAL-ORDER:
  category: POSTAL
  delivery_modes:
    - cashout
  hold_required: true
  hold_expiry_seconds: 604800
  reversal_window_seconds: 2592000
  partial_debit_allowed: false
  
  ui:
    icon: "✉️"
    display_name: "Postal Order"
    color: "#795548"
    description: "Postal money order"
  
  fields:
    - name: order_number
      label: "Order Number"
      type: text
      required: true
      pattern: "^[A-Z0-9]{10,20}$"
      placeholder: "Enter order number"
      help_text: "10-20 character order number"
    
    - name: order_pin
      label: "Order PIN"
      type: password
      required: true
      vault_field: pin
      min_length: 4
      max_length: 8
      placeholder: "Enter order PIN"
      help_text: "4-8 digit order PIN"
    
    - name: postal_code
      label: "Postal Code"
      type: text
      required: false
      placeholder: "Enter postal code"
      help_text: "Postal code for the order"

# ------------------------------------------------------------
# CHEQUE - Bank cheque
# ------------------------------------------------------------
CHEQUE:
  category: CHEQUE
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 86400
  reversal_window_seconds: 2592000
  partial_debit_allowed: false
  
  ui:
    icon: "📝"
    display_name: "Cheque"
    color: "#607D8B"
    description: "Bank cheque"
  
  fields:
    - name: cheque_number
      label: "Cheque Number"
      type: text
      required: true
      pattern: "^[0-9]{6,10}$"
      placeholder: "Enter cheque number"
      help_text: "6-10 digit cheque number"
    
    - name: bank_code
      label: "Bank Code"
      type: text
      required: true
      pattern: "^[A-Z0-9]{4,8}$"
      placeholder: "Enter bank code"
      help_text: "4-8 character bank code"
    
    - name: branch_code
      label: "Branch Code"
      type: text
      required: false
      pattern: "^[A-Z0-9]{4,6}$"
      placeholder: "Enter branch code"
      help_text: "Branch code (optional)"

# ------------------------------------------------------------
# CRYPTO - Cryptocurrency wallet
# ------------------------------------------------------------
CRYPTO:
  category: CRYPTO
  delivery_modes:
    - deposit
    - cashout
  hold_required: true
  hold_expiry_seconds: 3600
  reversal_window_seconds: 604800
  partial_debit_allowed: false
  
  ui:
    icon: "₿"
    display_name: "Cryptocurrency"
    color: "#F7931A"
    description: "Cryptocurrency wallet"
  
  fields:
    - name: wallet_address
      label: "Wallet Address"
      type: text
      required: true
      pattern: "^[a-zA-Z0-9]{26,42}$"
      placeholder: "Enter wallet address"
      help_text: "26-42 character wallet address"
    
    - name: network
      label: "Network"
      type: select
      required: true
      options:
        - "Bitcoin"
        - "Ethereum"
        - "Solana"
        - "USDC"
        - "USDT"
      placeholder: "Select network"
      help_text: "Cryptocurrency network"
