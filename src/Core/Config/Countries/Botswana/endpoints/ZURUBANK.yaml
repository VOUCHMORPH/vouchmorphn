# ============================================
# ZURUBANK - Connection Configuration
# ============================================
# This file contains ONLY connection details.
# No secrets are stored here (see vault section).
# ============================================

version: "3.1.0"
participant: ZURUBANK

# ------------------------------------------------------------
# Connection settings
# ------------------------------------------------------------
connection:
  base_url: "https://zurubank-production.up.railway.app/Backend"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "GenericFinancialInstitutionAdapter"
  
  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    # Secret lives in environment variable or Vault
    secret_source:
      type: env_var
      name: "ZURUBANK_API_KEY"

# ------------------------------------------------------------
# Vault mapping for keys (no actual secrets)
# ------------------------------------------------------------
vault:
  encryption_key_env: "ENCRYPTION_KEY"
  
  incoming_keys:
    CAZACOM:
      source: env_var
      name: "CAZACOM_API_KEY"
    VOUCHMORPH:
      source: env_var
      name: "VOUCHMORPH_API_KEY"
  
  outgoing_keys:
    CAZACOM:
      source: env_var
      name: "UPSTREAM_CAZACOM_KEY"
    VOUCHMORPH:
      source: env_var
      name: "UPSTREAM_VOUCHMORPH_KEY"

# ------------------------------------------------------------
# Health check endpoints
# ------------------------------------------------------------
service_status:
  enabled: true
  endpoint: "/api/v1/status"
  health_endpoint: "/health"
  failure_threshold: 3
  recovery_threshold: 2

# ------------------------------------------------------------
# API endpoints
# ------------------------------------------------------------
endpoints:
  verify_asset: "/api/v1/verify_asset.php"
  place_hold: "/api/v1/hold.php"
  release_hold: "/api/v1/hold.php"
  debit_funds: "/api/v1/settlement/notify_debit.php"
  process_deposit: "/api/v1/deposit/direct.php"
  reverse_transaction: "/api/v1/hold.php"
  generate_token: "/api/v1/atm/generate_code.php"
  verify_token: "/api/v1/atm/atm_cashout.php"
  confirm_cashout: "/api/v1/atm_cashout.php"

# ------------------------------------------------------------
# Callback URLs (where ZURUBANK calls us back)
# ------------------------------------------------------------
callbacks:
  hold_confirmed: "/api/v1/callbacks/hold-confirmed"
  hold_released: "/api/v1/callbacks/hold-released"
  debit_confirmed: "/api/v1/callbacks/debit-confirmed"
  deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
  reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"

# ------------------------------------------------------------
# Phone number formatting rules
# ------------------------------------------------------------
phone_format:
  prefix: "+"
  country_code: "267"
  strip_leading_zeros: true
  expected_length: 11

# ------------------------------------------------------------
# Message headers and tracing
# ------------------------------------------------------------
message_profile:
  correlation_id_header: "X-Correlation-ID"
  idempotency_key_header: "X-Idempotency-Key"
  signature_header: "X-Signature"
  timestamp_header: "X-Timestamp"
  trace_id_prefix: "ZURUBANK"

# ------------------------------------------------------------
# Idempotency settings
# ------------------------------------------------------------
idempotency:
  enabled: true
  header_name: "X-Idempotency-Key"
  ttl_seconds: 86400

# ------------------------------------------------------------
# Retry policy for failed requests
# ------------------------------------------------------------
retry_policy:
  max_retries: 3
  retry_delay_ms: 1000
  retry_on:
    - timeout
    - 5xx
    - network_error
