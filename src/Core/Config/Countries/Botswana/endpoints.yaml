# ------------------------------------------------------------
# CAZACOM - Mobile network operator
# ------------------------------------------------------------
CAZACOM:
  
  base_url: "https://cazacom-production.up.railway.app"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "MobileMoneyAdapter"
  
  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "CAZACOM_API_KEY"
  
  endpoints:
    deposit:
      verify_wallet: "/api/v1/mno/verify_wallet"
      place_hold: "/api/v1/mno/hold"
      confirm_deposit: "/api/v1/mno/credit"
      release_hold: "/api/v1/mno/release_hold"
    
    cashout:
      verify_wallet: "/api/v1/mno/verify_wallet"
      place_hold: "/api/v1/mno/hold"
      debit_funds: "/api/v1/mno/debit"
      confirm_cashout: "/api/v1/mno/confirm_cashout"
      generate_token: "/api/v1/mno/generate_code"
      verify_token: "/api/v1/mno/verify_code"
      release_hold: "/api/v1/mno/release_hold"
    
    common:
      reverse_transaction: "/api/v1/mno/reverse"
      check_balance: "/api/v1/mno/balance"
      transaction_history: "/api/v1/mno/transactions"
      status: "/api/v1/status"
      health: "/health"
  
  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
  
  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
    mno_prefixes: ["71", "72", "73", "74", "75", "76"]
  
  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Signature"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "CAZACOM"
  
  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]

# ------------------------------------------------------------
# VOUCHMORPH - Orchestration layer
# ------------------------------------------------------------
VOUCHMORPH:
  
  base_url: "https://vouchmorph.up.railway.app"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "VouchMorphOrchestrationAdapter"
  
  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "VOUCHMORPH_API_KEY"
  
  endpoints:
    deposit:
      load_card: "/api/v1/cards/load.php"
      authorize: "/api/v1/cards/authorize.php"
      check_balance: "/api/v1/cards/balance.php"
    
    cashout:
      authorize: "/api/v1/cards/authorize.php"
      swipe: "/api/v1/cards/swipe.php"
      check_balance: "/api/v1/cards/balance.php"
    
    swap:
      execute: "/api/v1/swap/execute.php"
      status: "/api/v1/swap/status.php"
      cancel: "/api/v1/swap/cancel.php"
    
    common:
      issue_card: "/api/v1/cards/issue.php"
      block_card: "/api/v1/cards/block.php"
      transactions: "/api/v1/cards/transactions.php"
      status: "/api/v1/status"
      health: "/health"
      regulatory_report: "/api/regulatory/report"
  
  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
    swap_completed: "/api/v1/callbacks/swap-completed"
  
  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
  
  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "VOUCHMOR"
  
  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]
