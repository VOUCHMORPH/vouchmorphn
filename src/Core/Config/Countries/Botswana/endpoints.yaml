# ============================================
# PARTICIPANT ENDPOINTS
# ============================================
# One file. Dashboard loads this dynamically.
# To get endpoints for a participant:
#   endpoints[participant_id][operation]
# ============================================

version: "3.1.0"

# ------------------------------------------------------------
# ZURUBANK - Traditional bank
# ------------------------------------------------------------
ZURUBANK:
  
  # Connection details
  base_url: "https://zurubank-production.up.railway.app/Backend"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "GenericFinancialInstitutionAdapter"
  
  # Authentication
  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "ZURUBANK_API_KEY"
  
  # API endpoints by operation
  endpoints:
    # Deposit operations (money INTO participant)
    deposit:
      verify_account: "/api/v1/verify_asset.php"
      place_hold: "/api/v1/hold.php"
      confirm_deposit: "/api/v1/deposit/direct.php"
      release_hold: "/api/v1/hold.php"
    
    # Cashout operations (money OUT OF participant)
    cashout:
      verify_asset: "/api/v1/verify_asset.php"
      place_hold: "/api/v1/hold.php"
      debit_funds: "/api/v1/settlement/notify_debit.php"
      confirm_cashout: "/api/v1/atm_cashout.php"
      generate_token: "/api/v1/atm/generate_code.php"
      verify_token: "/api/v1/atm/atm_cashout.php"
      release_hold: "/api/v1/hold.php"
    
    # Common operations
    common:
      reverse_transaction: "/api/v1/hold.php"
      status: "/api/v1/status"
      health: "/health"
  
  # Callbacks (where ZURUBANK calls us)
  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
  
  # Formatting rules
  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
  
  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Signature"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "ZURUBANK"
  
  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]

