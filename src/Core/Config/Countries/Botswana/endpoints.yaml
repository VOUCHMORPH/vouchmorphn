# ============================================
# PARTICIPANT ENDPOINTS
# ============================================
version: "3.2.0"

# ------------------------------------------------------------
# ZURUBANK - Traditional bank (also technical host for ABSA)
# ------------------------------------------------------------
ZURUBANK:
  base_url: "https://zurubank-production.up.railway.app/Backend"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "GenericFinancialInstitutionAdapter"

  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "ZURUBANK_API_KEY"

  oauth:
    client_id: "VOUCHMORPH_APP_ID"
    client_secret: "YOUR_BANK_SECRET"
    redirect_uri: "https://vouchmorphn-production.up.railway.app/api/v1/agent/oauth_callback.php"
    authorization_url: "/api/v1/oauth/authorize.php"
    token_url: "/api/v1/oauth/token.php"
    refresh_url: "/api/v1/oauth/refresh.php"
    revoke_url: "/api/v1/oauth/revoke.php"
    userinfo_url: "/api/v1/oauth/userinfo.php"
    scopes: ["balance", "transactions", "payments"]

  source_linking:
    initiate: "/api/v1/oauth/authorize.php"
    verify: "/api/v1/oauth/token.php"
    refresh: "/api/v1/oauth/refresh.php"
    revoke: "/api/v1/oauth/revoke.php"
    use: "/api/v1/verify_asset.php"

  endpoints:
    source:
      verify_asset: "/api/v1/verify_asset.php"
      place_hold: "/api/v1/hold.php"
      debit_funds: "/api/v1/settlement/notify_debit.php"
      release_hold: "/api/v1/hold.php"
      get_balance: "/api/v1/accounts/balance.php"
      get_transactions: "/api/v1/transactions.php"
    destination_cashout:
      generate_token: "/api/v1/atm/generate_code.php"
      verify_token: "/api/v1/atm/atm_cashout.php"
      confirm_cashout: "/api/v1/atm_cashout.php"
    destination_deposit:
      process_deposit: "/api/v1/deposit/direct.php"
      verify_account: "/api/v1/verify_asset.php"
    common:
      transfer: "/api/v1/transfer.php"
      reverse: "/api/v1/hold.php"
      status: "/api/v1/status"
      health: "/health"

  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
    cashout_confirmed: "/api/v1/callbacks/cashout-confirmed"

  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
    supported_networks: ["mascom", "orange", "btc"]

  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Signature"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "ZURUBANK"

  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]

# ------------------------------------------------------------
# ABSA - Independent DIRECT bank participant, technically
# hosted on Zurubank's infrastructure (same base_url as
# ZURUBANK above), but with its OWN API key so requests are
# attributed to ABSA specifically, not to Zurubank. Zurubank's
# receiving endpoints must recognize the ABSA_API_KEY and
# resolve it to ABSA's own accounts/ledger, not Zurubank's own.
# ------------------------------------------------------------
ABSA:
  base_url: "https://zurubank-production.up.railway.app/Backend"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "GenericFinancialInstitutionAdapter"

  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "ABSA_API_KEY"

  oauth:
    client_id: "VOUCHMORPH_APP_ID"
    client_secret: "YOUR_BANK_SECRET"
    redirect_uri: "https://vouchmorphn-production.up.railway.app/api/v1/agent/oauth_callback.php"
    authorization_url: "/api/v1/oauth/authorize.php"
    token_url: "/api/v1/oauth/token.php"
    refresh_url: "/api/v1/oauth/refresh.php"
    revoke_url: "/api/v1/oauth/revoke.php"
    userinfo_url: "/api/v1/oauth/userinfo.php"
    scopes: ["balance", "transactions", "payments"]

  source_linking:
    initiate: "/api/v1/oauth/authorize.php"
    verify: "/api/v1/oauth/token.php"
    refresh: "/api/v1/oauth/refresh.php"
    revoke: "/api/v1/oauth/revoke.php"
    use: "/api/v1/verify_asset.php"

  endpoints:
    source:
      verify_asset: "/absa_participant.php?action=verify_asset"
      place_hold: "/absa_participant.php?action=place_hold"
      debit_funds: "/absa_participant.php?action=debit_funds"
      release_hold: "/absa_participant.php?action=release_hold"
      get_balance: "/absa_participant.php?action=account_balance"
    destination_cashout:
      generate_token: "/absa_participant.php?action=generate_token"
      verify_token: "/absa_participant.php?action=verify_token"
      confirm_cashout: "/absa_participant.php?action=confirm_cashout"
    destination_deposit:
      process_deposit: "/absa_participant.php?action=process_deposit"
      verify_account: "/absa_participant.php?action=verify_account"
    common:
      transfer: "/absa_participant.php?action=process_deposit"
      status: "/absa_participant.php?action=check_status"
      health: "/health"

  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
    cashout_confirmed: "/api/v1/callbacks/cashout-confirmed"

  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
    supported_networks: ["mascom", "orange", "btc"]

  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Signature"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "ABSA"

  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]

