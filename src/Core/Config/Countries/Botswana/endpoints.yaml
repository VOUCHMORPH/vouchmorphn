# ------------------------------------------------------------
# CAZACOM - Mobile network operator (MNO)
# ------------------------------------------------------------
CAZACOM:
  
  base_url: "https://cazacom-production.up.railway.app/backend"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "MobileMoneyAdapter"
  
  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "CAZACOM_API_KEY"
  
  # Source linking (USSD-based)
  source_linking:
    initiate: "/api/v1/mno/initiate_link"
    verify: "/api/v1/mno/verify_link"
    refresh: "/api/v1/mno/refresh"
    revoke: "/api/v1/mno/revoke"
    use: "/api/v1/mno/verify_wallet"
  
  oauth:
    authorization_url: "/oauth/authorize"
    token_url: "/oauth/token"
    refresh_url: "/oauth/refresh"
    revoke_url: "/oauth/revoke"
    userinfo_url: "/oauth/userinfo"
    scopes: ["wallet_balance", "wallet_transactions", "wallet_payments"]
  
  endpoints:
    source:
      verify_asset: "/api/v1/mno/verify_wallet"         
      place_hold: "/api/v1/mno/hold"                    
      debit_funds: "/api/v1/mno/debit"                   
      release_hold: "/api/v1/mno/release_hold"          
      get_balance: "/api/v1/mno/balance"                
      get_transactions: "/api/v1/mno/transactions"      
    
    destination_cashout:
      generate_token: "/api/v1/mno/generate_code"        
      verify_token: "/api/v1/mno/verify_code"           
      confirm_cashout: "/api/v1/mno/confirm_cashout"    
    
    destination_deposit:
      process_deposit: "/api/v1/mno/credit"              
      verify_account: "/api/v1/mno/verify_wallet"       
    
    common:
      transfer: "/api/v1/mno/transfer"
      reverse: "/api/v1/mno/reverse"
      status: "/api/v1/status"
      health: "/health"
  
  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
    cashout_confirmed: "/api/v1/callbacks/cashout-confirmed"
  
  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
    mno_prefixes: ["71", "72", "73", "74", "75", "76"]
    default_network: "mascom"
  
  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Signature"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "CAZACOM"
  
  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]

