# ------------------------------------------------------------
CENTRALSWITCH:
  base_url: "https://centralswitch-production.up.railway.app"
  timeout_ms: 10000
  sandbox_mode: true
  adapter_class: "CentralSwitchAdapter"

  auth:
    type: HMAC_SHARED_SECRET
    timestamp_header: "X-Api-Timestamp"
    signature_header: "X-Api-Signature"
    secret_source: { type: env_var, name: "CENTRALSWITCH_VOUCHMORPH_SECRET" }

  self_participant_id_source:
    type: env_var
    name: "CENTRALSWITCH_VOUCHMORPH_PARTICIPANT_ID"

  endpoints:
    common:
      submit_transfer: "/api/submit_transfer.php"
      create_quote: "/api/create_quote.php"
      transaction_status: "/api/v1/transactions.php"
      health: "/health"

  message_profile:
    timestamp_header: "X-Api-Timestamp"
    signature_header: "X-Api-Signature"
    trace_id_prefix: "CENTRALSWITCH"

  retry_policy:
    max_retries: 2
    retry_delay_ms: 500
    retry_on: [timeout, network_error]   # never on 4xx/5xx — those are authoritative rejections

