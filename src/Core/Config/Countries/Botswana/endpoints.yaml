# ------------------------------------------------------------
# MTN - Independent DIRECT MNO participant, technically hosted
# on Cazacom's infrastructure (same base_url as CAZACOM above),
# own API key so requests are attributed to MTN's wallet ledger
# specifically. Points at mtn_momo_participant.php's action
# routes rather than Cazacom's own MNO endpoints, since MTN's
# deposit/cashout logic is its own file (mtn_wallets/mtn_transfers),
# not shared state with Cazacom's own MobileMoneyAdapter backend.
# Collection (requesttopay) now implemented — placeHold() may
# take several seconds to resolve via customer phone approval
# and can time out under real MTN Collection load.
# ------------------------------------------------------------
MTN:
  base_url: "https://cazacom-production.up.railway.app"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "MobileMoneyAdapter"

  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "MTN_VOUCHMORPH_API_KEY"

  source_linking:
    initiate: "/mtn_momo_participant.php?action=initiate_link"
    verify: "/mtn_momo_participant.php?action=verify_link"
    refresh: "/mtn_momo_participant.php?action=refresh"
    revoke: "/mtn_momo_participant.php?action=revoke"
    use: "/mtn_momo_participant.php?action=wallet_balance"

  endpoints:
    source:
      verify_asset: "/mtn_momo_participant.php?action=wallet_balance"
      place_hold: "/mtn_momo_participant.php?action=place_hold"
      debit_funds: "/mtn_momo_participant.php?action=debit_funds"
      release_hold: "/mtn_momo_participant.php?action=release_hold"
      get_balance: "/mtn_momo_participant.php?action=wallet_balance"
      get_transactions: "/mtn_momo_participant.php?action=transactions"
    destination_cashout:
      # No ATM network for MTN — cashout goes through the agent
      # network instead. See destination_deposit + initiate_cashout
      # below; VouchMorph's routing_policy.php sets cashout=>false
      # for MTN so this section is never actually invoked, kept
      # here only for interface-shape consistency across adapters.
      generate_token: "/mtn_momo_participant.php?action=initiate_cashout"
      verify_token: "/mtn_momo_participant.php?action=confirm_cashout"
      confirm_cashout: "/mtn_momo_participant.php?action=confirm_cashout"
    destination_deposit:
      process_deposit: "/mtn_momo_participant.php?action=process_deposit"
      verify_account: "/mtn_momo_participant.php?action=wallet_balance"
    common:
      transfer: "/mtn_momo_participant.php?action=process_deposit"
      reverse: "/mtn_momo_participant.php?action=reverse"
      status: "/mtn_momo_participant.php?action=check_status"
      health: "/health"

  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
    cashout_confirmed: "/api/v1/callbacks/cashout-confirmed"

  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
    mno_prefixes: ["71", "72", "73", "74", "75", "76"]
    default_network: "mtn"

  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Api-Signature"
    timestamp_header: "X-Api-Timestamp"
    trace_id_prefix: "MTN"

  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]

# ------------------------------------------------------------
# CENTRALSWITCH - National payment switch rail (not an
# institution itself — a routing target selected by
# RouteResolver when routing_policy.php prefers it for a
# given operation/participant pair). Uses HMAC shared-secret
# auth, not API_KEY, matching HMACAuth on the switch side.
# ------------------------------------------------------------
CENTRALSWITCH:
  base_url: "https://centralswitch-production.up.railway.app"
  timeout_ms: 10000
  sandbox_mode: true
  adapter_class: "CentralSwitchAdapter"

  auth:
    type: HMAC_SHARED_SECRET
    timestamp_header: "X-Api-Timestamp"
    signature_header: "X-Api-Signature"
    secret_source:
      type: env_var
      name: "CENTRALSWITCH_VOUCHMORPH_SECRET"

  # VouchMorph's own participant_id as registered on the switch
  # (switch_participants.participant_id for the VOUCHMORPH row).
  self_participant_id_source:
    type: env_var
    name: "CENTRALSWITCH_VOUCHMORPH_PARTICIPANT_ID"

  endpoints:
    common:
      submit_transfer: "/api/submit_transfer.php"
      create_quote: "/api/create_quote.php"
      transaction_status: "/api/v1/transactions.php"
      health: "/health"

  message_profile:
    timestamp_header: "X-Api-Timestamp"
    signature_header: "X-Api-Signature"
    trace_id_prefix: "CENTRALSWITCH"

  retry_policy:
    max_retries: 2
    retry_delay_ms: 500
    retry_on: [timeout, network_error]   # NOT on 4xx/5xx — those are authoritative rejections, not transient

# ------------------------------------------------------------
# VOUCHMORPH - Orchestration layer (internal)
# ------------------------------------------------------------
VOUCHMORPH:
  base_url: "https://vouchmorph.up.railway.app"
  timeout_ms: 5000
  sandbox_mode: true
  adapter_class: "VouchMorphOrchestrationAdapter"

  auth:
    type: API_KEY
    header_name: "X-API-KEY"
    secret_source:
      type: env_var
      name: "VOUCHMORPH_API_KEY"

  oauth:
    authorization_url: "/oauth/authorize"
    token_url: "/oauth/token"
    refresh_url: "/oauth/refresh"
    revoke_url: "/oauth/revoke"
    userinfo_url: "/oauth/userinfo"
    scopes: ["swaps", "cards", "settlements", "reports"]

  endpoints:
    source:
      verify_asset: "/api/v1/cards/verify.php"
      place_hold: "/api/v1/cards/authorize.php"
      debit_funds: "/api/v1/cards/load.php"
      release_hold: "/api/v1/cards/void.php"
      get_balance: "/api/v1/cards/balance.php"
      get_transactions: "/api/v1/cards/transactions.php"
    destination_cashout:
      generate_token: "/api/v1/cards/atm/generate.php"
      verify_token: "/api/v1/cards/atm/verify.php"
      confirm_cashout: "/api/v1/cards/atm/confirm.php"
    destination_deposit:
      process_deposit: "/api/v1/cards/load.php"
      verify_account: "/api/v1/cards/verify.php"
    common:
      transfer: "/api/v1/swap/execute.php"
      reverse: "/api/v1/swap/cancel.php"
      status: "/api/v1/swap/status.php"
      health: "/health"
      regulatory_report: "/api/regulatory/report"

  callbacks:
    hold_confirmed: "/api/v1/callbacks/hold-confirmed"
    hold_released: "/api/v1/callbacks/hold-released"
    debit_confirmed: "/api/v1/callbacks/debit-confirmed"
    deposit_confirmed: "/api/v1/callbacks/deposit-confirmed"
    reversal_confirmed: "/api/v1/callbacks/reversal-confirmed"
    swap_completed: "/api/v1/callbacks/swap-completed"
    cashout_confirmed: "/api/v1/callbacks/cashout-confirmed"

  phone_format:
    prefix: "+"
    country_code: "267"
    expected_length: 11
    supported_networks: ["mascom", "orange", "btc"]

  message_profile:
    correlation_id_header: "X-Correlation-ID"
    idempotency_key_header: "X-Idempotency-Key"
    signature_header: "X-Signature"
    timestamp_header: "X-Timestamp"
    trace_id_prefix: "VOUCHMOR"

  retry_policy:
    max_retries: 3
    retry_delay_ms: 1000
    retry_on: [timeout, 5xx, network_error]
