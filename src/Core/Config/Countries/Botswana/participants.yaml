# ============================================
# PARTICIPANT REGISTRY
# Identity, capabilities, and institutional facts only.
# No connection details, no endpoints, no secrets — those
# live in endpoints.yaml.
# ============================================
version: "3.3.0"

participants:
  # ----------------------------------------------------------
  # ZURUBANK - Traditional commercial bank
  # ----------------------------------------------------------
  ZURUBANK:
    provider_code: ZURUBANK
    id: ZURUBWXX
    name: "Zuru Bank"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: ZURUBWXX

    settlement_webhook_url: "https://zurubank-example.com/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - ACCOUNT
      - VOUCHER
      - CARD

    card_config:
      network: VISA
      supported_card_types: [DEBIT, CREDIT]
      credit_card_as_source: false
      debit_hold_model: NATIVE
      credit_hold_model: PRE_AUTH
      credit_hold_expiry_hours: 72

    capabilities:
      source: true
      deposit: true
      cashout: true
      identity_holding: true

    hold_model: NATIVE

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 30
      poll_max_attempts: 20

    routing:
      priority: 10
      cost_score: 5
      reliability_score: 9
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", USD: "T+2" }

    identity_accounts:
      BWP:
        receiving_identifier: "REPLACE_WITH_REAL_RECEIVING_ACCOUNT_NUMBER"
        receiving_identifier_type: "account_number"
        holding_identifier: "REPLACE_WITH_REAL_HOLDING_ACCOUNT_NUMBER"
        holding_identifier_type: "account_number"

    settlement_account:
      BWP:
        identifier: "REPLACE_WITH_REAL_SETTLEMENT_ACCOUNT_NUMBER"
        identifier_type: "account_number"

  # ----------------------------------------------------------
  # ABSA - Independent DIRECT bank, technically hosted on
  # Zurubank's infrastructure. Also reachable via CENTRALSWITCH.
