# ============================================
# PARTICIPANT REGISTRY
# Identity, capabilities, and institutional facts only.
# No connection details, no endpoints, no secrets — those
# live in endpoints.yaml.
# ============================================
version: "3.3.0"

participants:
  # ----------------------------------------------------------
  # ZURUBANK - Traditional commercial bank
  # ----------------------------------------------------------
  ZURUBANK:
    provider_code: ZURUBANK
    id: ZURUBWXX
    name: "Zuru Bank"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: ZURUBWXX

    settlement_webhook_url: "https://zurubank-production.up.railway.app/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - ACCOUNT
      - VOUCHER
      - CARD

    card_config:
      network: VISA
      supported_card_types: [DEBIT, CREDIT]
      credit_card_as_source: false
      debit_hold_model: NATIVE
      credit_hold_model: PRE_AUTH
      credit_hold_expiry_hours: 72

    capabilities:
      source: true
      deposit: true
      cashout: true
      identity_holding: true
      reservation_accounts: true
      # Flipped true (15 Sep 2026) to exercise the v2 algorithm end-to-end
      # against this one sandbox institution before enabling it anywhere
      # else -- staged rollout per the approved plan. Every other
      # participant in this file stays false until ZURUBANK is verified.
      claim_algorithm_v2: true

    hold_model: NATIVE

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 30
      poll_max_attempts: 20

    routing:
      priority: 10
      cost_score: 5
      reliability_score: 9
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", USD: "T+2" }

    # FIX (16 Sep 2026): these were placeholders never filled in, which
    # was the root cause of identity claims failing at ZURUBANK with a
    # misleading "Bank communication failed" (see
    # assertNotPlaceholderIdentifier() in SwapService.php). ZURUBANK's
    # own notify_debit.php/deposit/direct.php now infer an identity-swap
    # request from the payload shape (reason text / destination_identifier
    # presence) rather than validating this value against anything, so
    # these are internal ledger codes (swap_internal_accounts.account_code
    # on ZURUBANK's side, seeded by their
    # database/migrations/2026_09_16_identity_swap_internal_accounts.sql),
    # not real bank account numbers -- set here for accuracy/documentation
    # and so this passes the placeholder guard, matching what ZURUBANK
    # actually uses.
    identity_accounts:
      BWP:
        receiving_identifier: "IDENTITY-RECEIVING"
        receiving_identifier_type: "account_number"
        holding_identifier: "IDENTITY-HOLDING"
        holding_identifier_type: "account_number"

    settlement_account:
      BWP:
        identifier: "IDENTITY-SETTLEMENT"
        identifier_type: "account_number"

  # ----------------------------------------------------------
  # ABSA - Independent DIRECT bank, technically hosted on
  # Zurubank's infrastructure. Also reachable via CENTRALSWITCH.
  # ----------------------------------------------------------
  ABSA:
    provider_code: ABSA
    id: ABSABWXX
    name: "ABSA Bank"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: ABSABWXX
    technical_host: ZURUBANK

    settlement_webhook_url: "https://zurubank-production.up.railway.app/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - ACCOUNT
      - VOUCHER
      - CARD

    card_config:
      network: VISA
      supported_card_types: [DEBIT, CREDIT]
      credit_card_as_source: false
      debit_hold_model: NATIVE
      credit_hold_model: PRE_AUTH
      credit_hold_expiry_hours: 72

    capabilities:
      source: true
      deposit: true
      cashout: true
      identity_holding: true
      reservation_accounts: true
      # Gates swap-to-identity algorithm v2 behavior added after the
      # reservation-account primitive above (Phase D's park-vs-release
      # expiry branch, Point X's obligation-ledger wiring). False until
      # this participant is deliberately verified and flipped on -- see
      # the approved plan's staged-rollout section.
      claim_algorithm_v2: false

    hold_model: NATIVE

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 20
      poll_max_attempts: 15

    switch_participant_ids:
      CENTRALSWITCH: "122e2314-8ec0-42dd-baf6-aaed8fcb6605"

    routing:
      priority: 10
      cost_score: 5
      reliability_score: 9
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", USD: "T+2" }

    identity_accounts:
      BWP:
        receiving_identifier: "REPLACE_WITH_REAL_RECEIVING_ACCOUNT_NUMBER"
        receiving_identifier_type: "account_number"
        holding_identifier: "REPLACE_WITH_REAL_HOLDING_ACCOUNT_NUMBER"
        holding_identifier_type: "account_number"

    settlement_account:
      BWP:
        identifier: "REPLACE_WITH_REAL_SETTLEMENT_ACCOUNT_NUMBER"
        identifier_type: "account_number"

  # ----------------------------------------------------------
  # SACCUSSALIS - Commercial bank
  # ----------------------------------------------------------
  SACCUSSALIS:
    provider_code: SACCUSSALIS
    id: SACCUSBWXX
    name: "Saccussalis"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: SACCUBWXX

    settlement_webhook_url: "https://saccussalis-production.up.railway.app/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - ACCOUNT
      - VOUCHER
      - WALLET
      - CARD

    card_config:
      network: MASTERCARD
      supported_card_types: [DEBIT, CREDIT]
      credit_card_as_source: false
      debit_hold_model: NATIVE
      credit_hold_model: PRE_AUTH
      credit_hold_expiry_hours: 72

    capabilities:
      source: true
      deposit: true
      cashout: true
      identity_holding: true
      reservation_accounts: true
      # Gates swap-to-identity algorithm v2 behavior added after the
      # reservation-account primitive above (Phase D's park-vs-release
      # expiry branch, Point X's obligation-ledger wiring).
      #
      # Flipped true (19 Sep 2026), second participant after ZURUBANK.
      # Left false, expireIdentitySwap() takes the release-to-sender
      # branch for GOVERNMENT and BUSINESS_OR_TRUST holds at this
      # institution -- money Phase D says is owed to the identity and
      # cannot be un-sent. That was a live breach from the moment claims
      # here started working, so this is a correctness fix, not just the
      # next step of a rollout.
      #
      # What it turns on here:
      #   as SOURCE, on expiry -- GOVERNMENT/BUSINESS_OR_TRUST value parks
      #     in the beneficiary's reservation account at SACCUSSALIS instead
      #     of returning to the sender. Depends on reservation_accounts
      #     above, which SACCUSSALIS serves at
      #     backend/api/v1/accounts/reservation.
      #   as DESTINATION, on claim -- the Point X obligation ledger runs:
      #     net_positions rows and fee invoices this institution has not
      #     seen before.
      # Two further effects (settlement retry/compensate, the
      # settled_pending_payout status) sit in the consolidation path, which
      # no adapter reaches today because none implements internalSweep().
      claim_algorithm_v2: true

    hold_model: NATIVE

    settlement_confirmation:
      mode: PUSH

    routing:
      priority: 15
      cost_score: 4
      reliability_score: 8
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, EUR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", EUR: "T+2" }

    # SACCUSSALIS's real settlement_accounts rows, read from its own
    # repository (marvinsehunelo/saccussalis): the table is
    # settlement_accounts(account_name UNIQUE, account_number UNIQUE, ...),
    # seeded with MAIN_SETTLEMENT/10000001 in database/SaccusSalisbank.sql,
    # and backend/api/v1/identity_claims/receive.php creates
    # IDENTITY_CLAIMS_RECEIVING/10000002 and IDENTITY_CLAIMS_HOLDING/10000003
    # on first use (INSERT ... ON CONFLICT (account_number) DO NOTHING).
    #
    # The account_number is used rather than the account_name because
    # identifier_type says account_number and SACCUSSALIS's table has a real
    # one. Note that its identity_claims endpoints resolve their own accounts
    # by hardcoded account_name and ignore the identifier we send, so for
    # those legs this is documentation -- but settlement_account below is
    # sent to the DESTINATION institution as source_identifier, naming the
    # counterparty account that funds the delivery, so it has to be right.
    #
    # Quoted deliberately: unquoted these parse as integers, and an account
    # identifier must stay a string.
    identity_accounts:
      BWP:
        receiving_identifier: "10000002"
        receiving_identifier_type: "account_number"
        holding_identifier: "10000003"
        holding_identifier_type: "account_number"

    settlement_account:
      BWP:
        identifier: "10000001"
        identifier_type: "account_number"

