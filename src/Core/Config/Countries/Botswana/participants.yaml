  # ----------------------------------------------------------
  CAZACOM:
    provider_code: CAZACOM
    id: CAZACOM
    name: "CazaCom"
    type: MNO
    country: BW
    status: ACTIVE

    settlement_webhook_url: "https://cazacom-example.com/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - WALLET
      - VOUCHER

    capabilities:
      source: true
      deposit: true
      cashout: false
      identity_holding: true

    hold_model: NATIVE

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 15
      poll_max_attempts: 20

    switch_participant_ids:
      CENTRALSWITCH: "72439d1d-4544-41fd-9576-8e9404a18cfc"

    routing:
      priority: 5
      cost_score: 3
      reliability_score: 7
      region: africa_south

    limits:
      min_amount: 1
      max_amount: 100000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1" }

    wallet_config:
      max_balance: 100000
      daily_transaction_limit: 50000
      per_transaction_limit: 10000
      kyc_tiers:
        - { tier: 1, max_balance: 5000,  daily_limit: 2000 }
        - { tier: 2, max_balance: 50000, daily_limit: 10000 }
        - { tier: 3, max_balance: 100000, daily_limit: 50000 }

    identity_accounts:
