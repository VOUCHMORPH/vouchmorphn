# ============================================
# PARTICIPANT REGISTRY
# Identity, capabilities, and institutional facts only.
# No connection details, no endpoints, no secrets — those
# live in endpoints.yaml.
# ============================================
version: "3.3.0"

participants:
  # ----------------------------------------------------------
  # ZURUBANK - Traditional commercial bank
  # ----------------------------------------------------------
  ZURUBANK:
    provider_code: ZURUBANK
    id: ZURUBWXX
    name: "Zuru Bank"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: ZURUBWXX

    asset_types:
      - ACCOUNT
      - VOUCHER

    capabilities:
      source: true
      deposit: true
      cashout: true

    hold_model: NATIVE          # real hold/authorization API

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 30
      poll_max_attempts: 20

    routing:
      priority: 10
      cost_score: 5
      reliability_score: 9
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", USD: "T+2" }

  # ----------------------------------------------------------
  # ABSA - Independent DIRECT bank, technically hosted on
  # Zurubank's infrastructure. Also reachable via CENTRALSWITCH.
  # ----------------------------------------------------------
  ABSA:
    provider_code: ABSA
    id: ABSABWXX
    name: "ABSA Bank"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: ABSABWXX
    technical_host: ZURUBANK     # infra note only — does not affect routing/settlement

    asset_types:
      - ACCOUNT
      - VOUCHER

    capabilities:
      source: true
      deposit: true
      cashout: true

    hold_model: NATIVE

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 20
      poll_max_attempts: 15

    switch_participant_ids:
      CENTRALSWITCH: "122e2314-8ec0-42dd-baf6-aaed8fcb6605"

    routing:
      priority: 10
      cost_score: 5
      reliability_score: 9
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", USD: "T+2" }

  # ----------------------------------------------------------
  # SACCUSSALIS - Commercial bank
  # ----------------------------------------------------------
  SACCUSSALIS:
    provider_code: SACCUSSALIS
    id: SACCUSBWXX
    name: "Saccussalis"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: SACCUBWXX

    asset_types:
      - ACCOUNT
      - VOUCHER
      - WALLET

    capabilities:
      source: true
      deposit: true
      cashout: true

    hold_model: NATIVE

    settlement_confirmation:
      mode: PUSH                 # calls VouchMorph's settlement_confirmed.php webhook

    routing:
      priority: 15
      cost_score: 4
      reliability_score: 8
      region: africa_south

    limits:
      min_amount: 10
      max_amount: 500000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, EUR, USD]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", EUR: "T+2" }

  # ----------------------------------------------------------
  # CAZACOM - Mobile network operator, also technical host for MTN
  # ----------------------------------------------------------
  CAZACOM:
    provider_code: CAZACOM
    id: CAZACOM
    name: "CazaCom"
    type: MNO
    country: BW
    status: ACTIVE

    asset_types:
      - WALLET
      - VOUCHER

    capabilities:
      source: true
      deposit: true
      cashout: false             # no ATM network

    hold_model: NATIVE

    settlement_confirmation:
      mode: POLL
      poll_delay_seconds: 15
      poll_max_attempts: 20

    switch_participant_ids:
      CENTRALSWITCH: "72439d1d-4544-41fd-9576-8e9404a18cfc"

    routing:
      priority: 5
      cost_score: 3
      reliability_score: 7
      region: africa_south

    limits:
      min_amount: 1
      max_amount: 100000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1" }

    wallet_config:
      max_balance: 100000
      daily_transaction_limit: 50000
      per_transaction_limit: 10000
      kyc_tiers:
        - { tier: 1, max_balance: 5000,  daily_limit: 2000 }
        - { tier: 2, max_balance: 50000, daily_limit: 10000 }
        - { tier: 3, max_balance: 100000, daily_limit: 50000 }

  # ----------------------------------------------------------
  # MTN - Mobile money, technically hosted on Cazacom's infra.
  # Collection (source/pull) implemented — see mtn_momo_participant.php.
  # No ATM network — agent cash-out only.
  # ----------------------------------------------------------
  MTN:
    provider_code: MTN
    id: MTNBWX1
    name: "MTN Mobile Money"
    type: MNO
    country: BW
    status: ACTIVE
    technical_host: CAZACOM

    asset_types:
      - WALLET
      - VOUCHER

    capabilities:
      source: true               # Collection (requesttopay) implemented
      deposit: true
      cashout: false

    hold_model: NATIVE            # MTN Collection approximates a real hold via
                                   # requesttopay approval — see class docblock
                                   # in mtn_momo_participant.php for the async
                                   # timing caveat this implies.

    source_is_async: true         # placeHold() may take several seconds to
                                   # resolve via customer phone approval, and
                                   # can time out under real Collection load.

    settlement_confirmation:
      mode: PUSH                  # MTN pushes via switch_webhook-style callback

    switch_participant_ids:
      CENTRALSWITCH: "8f05724f-e93b-4ad8-b874-aab32e0fa9bd"

    routing:
      priority: 5
      cost_score: 3
      reliability_score: 7
      region: africa_south

    limits:
      min_amount: 1
      max_amount: 100000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1" }

    wallet_config:
      max_balance: 100000
      daily_transaction_limit: 50000
      per_transaction_limit: 10000
      kyc_tiers:
        - { tier: 1, max_balance: 5000,  daily_limit: 2000 }
        - { tier: 2, max_balance: 50000, daily_limit: 10000 }
        - { tier: 3, max_balance: 100000, daily_limit: 50000 }

    agent_cashout:
      enabled: true
      code_expiry_minutes: 30

  # ----------------------------------------------------------
  # CENTRALSWITCH - National payment switch rail (not an
  # institution — a routing target). No hold_model or
  # settlement_confirmation: the switch settles atomically in
  # one call, so neither concept applies.
  # ----------------------------------------------------------
  CENTRALSWITCH:
    provider_code: CENTRALSWITCH
    id: VMPHCSW1
    name: "Central Switch"
    type: SWITCH
    country: BW
    status: ACTIVE

    capabilities:
      source: false               # not a debitable participant itself
      deposit: false
      cashout: false

    routing:
      priority: 1
      cost_score: 1
      reliability_score: 9
      region: local

  # ----------------------------------------------------------
  # VOUCHMORPH - Orchestration layer
  # ----------------------------------------------------------
  VOUCHMORPH:
    provider_code: VOUCHMORPH
    id: VMPHBWX1
    name: "VouchMorph"
    type: ORCHESTRATOR
    country: BW
    status: ACTIVE

    asset_types:
      - CARD
      - VOUCHER

    switch_participant_ids:
      CENTRALSWITCH: "cbcdd2a7-b3a3-4420-b034-a7ac03082ee1"

    routing:
      priority: 1
      cost_score: 1
      reliability_score: 10
      region: global

    limits:
      min_amount: 1
      max_amount: 1000000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, EUR, USD, GBP]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", EUR: "T+2", USD: "T+2", GBP: "T+2" }
