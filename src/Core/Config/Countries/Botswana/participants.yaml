        holding_identifier: "REPLACE_WITH_REAL_HOLDING_WALLET_ID"
        holding_identifier_type: "wallet_id"

    settlement_account:
      BWP:
        identifier: "REPLACE_WITH_REAL_SETTLEMENT_WALLET_ID"
        identifier_type: "wallet_id"

  # ----------------------------------------------------------
  # MTN - Mobile network operator (technically hosted on CAZACOM)
  # ----------------------------------------------------------
  MTN:
    provider_code: MTN
    id: MTNBWX1
    name: "MTN Mobile Money"
    type: MNO
    country: BW
    status: ACTIVE
    technical_host: CAZACOM

    settlement_webhook_url: "https://mtn-example.com/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - WALLET
      - VOUCHER

    capabilities:
      source: true              
      deposit: true
      cashout: false
      identity_holding: true

    hold_model: NATIVE         

    source_is_async: true        

    settlement_confirmation:
      mode: PUSH                 

    switch_participant_ids:
      CENTRALSWITCH: "8f05724f-e93b-4ad8-b874-aab32e0fa9bd"

    routing:
      priority: 5
      cost_score: 3
      reliability_score: 7
      region: africa_south

    limits:
      min_amount: 1
      max_amount: 100000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1" }

    wallet_config:
      max_balance: 100000
      daily_transaction_limit: 50000
      per_transaction_limit: 10000
      kyc_tiers:
        - { tier: 1, max_balance: 5000,  daily_limit: 2000 }
        - { tier: 2, max_balance: 50000, daily_limit: 10000 }
        - { tier: 3, max_balance: 100000, daily_limit: 50000 }

    agent_cashout:
      enabled: true
      code_expiry_minutes: 30

    identity_accounts:
      BWP:
        receiving_identifier: "REPLACE_WITH_REAL_RECEIVING_WALLET_ID"
        receiving_identifier_type: "wallet_id"
        holding_identifier: "REPLACE_WITH_REAL_HOLDING_WALLET_ID"
        holding_identifier_type: "wallet_id"

    settlement_account:
      BWP:
        identifier: "REPLACE_WITH_REAL_SETTLEMENT_WALLET_ID"
        identifier_type: "wallet_id"

  # ----------------------------------------------------------
  # FNBB_ACQUIRER - FNBB Card Acquiring (Visa/Mastercard)
  # ----------------------------------------------------------
  FNBB_ACQUIRER:
    provider_code: FNBB_ACQUIRER
    name: "FNBB Card Acquiring (Visa/Mastercard)"
    country_code: Botswana

    capabilities:
      source: true
      destination: false
      card_source: true

    card_acquirer:
      source_enabled: true
      pre_auth_check: true
      pre_auth_amount: 1.00
      max_single_auth_amount: 5000.00
      authorization_window_seconds: 604800
      destination_enabled: false
      max_single_load_amount: 5000.00

    auth:
      header_name: "X-API-Key"
      secret_source:
        type: env_var
        name: "FNBB_ACQUIRER_API_KEY"

    bank_client_class: "Infrastructure\\Banks\\CardAcquirerBankClient"

    settlement_confirmation:
      mode: POLL

  # ----------------------------------------------------------
  # CENTRALSWITCH - National payment switch rail (not an
  # institution — a routing target). No hold_model or
  # settlement_confirmation: the switch settles atomically in
  # one call, so neither concept applies.
  # ----------------------------------------------------------
  CENTRALSWITCH:
    provider_code: CENTRALSWITCH
    id: VMPHCSW1
    name: "Central Switch"
    type: SWITCH
    country: BW
    status: ACTIVE
    adapter_class: "Infrastructure\\Banks\\CentralSwitchAdapter"

    capabilities:
      source: false
      deposit: false
      cashout: false

    routing:
      priority: 1
      cost_score: 1
      reliability_score: 9
      region: local

  # ----------------------------------------------------------
  # VOUCHMORPH - Orchestration layer
  # ----------------------------------------------------------
  VOUCHMORPH:
    provider_code: VOUCHMORPH
    id: VMPHBWX1
    name: "VouchMorph"
    type: ORCHESTRATOR
    country: BW
    status: ACTIVE

    asset_types:
      - CARD
      - VOUCHER

    card_config:
      network: VOUCHMORPH
      supported_card_types: [DEBIT, CREDIT, PREPAID]
      credit_card_as_source: false
      debit_hold_model: NATIVE
      credit_hold_model: PRE_AUTH
      credit_hold_expiry_hours: 72

    capabilities:
      source: false
      deposit: false
      cashout: false

    switch_participant_ids:
      CENTRALSWITCH: "cbcdd2a7-b3a3-4420-b034-a7ac03082ee1"

    routing:
      priority: 1
      cost_score: 1
      reliability_score: 10
      region: global

    limits:
      min_amount: 1
      max_amount: 1000000
      currency: BWP

    cross_border:
      enabled: true
      supported_currencies: [BWP, ZAR, EUR, USD, GBP]
      settlement_cycles: { BWP: "T+0", ZAR: "T+1", EUR: "T+2", USD: "T+2", GBP: "T+2" }
