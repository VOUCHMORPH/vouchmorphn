  # ----------------------------------------------------------
  SACCUSSALIS:
    provider_code: SACCUSSALIS
    id: SACCUSBWXX
    name: "Saccussalis"
    type: BANK
    country: BW
    status: ACTIVE
    swift_bic: SACCUBWXX

    settlement_webhook_url: "https://saccussalis-example.com/api/v1/vouchmorph/settlement-instruction"

    asset_types:
      - ACCOUNT
      - VOUCHER
      - WALLET
      - CARD

    card_config:
      network: MASTERCARD
      supported_card_types: [DEBIT, CREDIT]
      credit_card_as_source: false
      debit_hold_model: NATIVE
      credit_hold_model: PRE_AUTH
      credit_hold_expiry_hours: 72

    capabilities:
      source: true
      deposit: true
