name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  sast:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Download PHPStan
        run: |
          mkdir -p tools
          curl -sSL -o tools/phpstan.phar \
            https://github.com/phpstan/phpstan/releases/latest/download/phpstan.phar
          chmod +x tools/phpstan.phar

      - name: Run PHPStan
        run: php tools/phpstan.phar analyse -c phpstan.neon --no-progress

  dependency-scan:
    name: Dependency vulnerability scan (composer audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run composer audit
        run: composer audit --no-interaction

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          chmod +x /tmp/gitleaks/gitleaks

      - name: Run gitleaks
        run: /tmp/gitleaks/gitleaks detect --source . --no-git --config .gitleaks.toml --redact -v
